<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #102a43; }
      .actor { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #1f3c88; }
      .step { font: 14px 'Segoe UI', Arial, sans-serif; fill: #334e68; }
      .note { font: 13px 'Segoe UI', Arial, sans-serif; fill: #486581; }
      .lifeline { stroke: #9fb3c8; stroke-width: 2; stroke-dasharray: 7 7; }
      .msg { stroke: #334e68; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .box { fill: #f8fbff; stroke: #9fb3c8; stroke-width: 2; }
      .alt { fill: #fffaf0; stroke: #d69e2e; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334e68" />
    </marker>
  </defs>

  <text x="40" y="52" class="title">didKYC DID/VC Verification and Agentic Payment Flow</text>

  <rect x="30" y="90" width="1740" height="850" class="box"/>

  <text x="90" y="130" class="actor">Human Owner</text>
  <text x="270" y="130" class="actor">eKYC/Issuer</text>
  <text x="450" y="130" class="actor">Cold Wallet</text>
  <text x="640" y="130" class="actor">AI Agent</text>
  <text x="820" y="130" class="actor">Gateway</text>
  <text x="980" y="130" class="actor">DID/VC Verifier</text>
  <text x="1180" y="130" class="actor">Policy Engine</text>
  <text x="1370" y="130" class="actor">Besu</text>
  <text x="1520" y="130" class="actor">Audit Store</text>

  <line x1="120" y1="150" x2="120" y2="910" class="lifeline"/>
  <line x1="300" y1="150" x2="300" y2="910" class="lifeline"/>
  <line x1="490" y1="150" x2="490" y2="910" class="lifeline"/>
  <line x1="680" y1="150" x2="680" y2="910" class="lifeline"/>
  <line x1="860" y1="150" x2="860" y2="910" class="lifeline"/>
  <line x1="1040" y1="150" x2="1040" y2="910" class="lifeline"/>
  <line x1="1240" y1="150" x2="1240" y2="910" class="lifeline"/>
  <line x1="1420" y1="150" x2="1420" y2="910" class="lifeline"/>
  <line x1="1580" y1="150" x2="1580" y2="910" class="lifeline"/>

  <line x1="120" y1="190" x2="300" y2="190" class="msg"/>
  <text x="132" y="182" class="step">1. Complete eKYC onboarding</text>

  <line x1="300" y1="235" x2="120" y2="235" class="msg"/>
  <text x="135" y="227" class="step">2. Identity approved</text>

  <line x1="300" y1="280" x2="490" y2="280" class="msg"/>
  <text x="320" y="272" class="step">3. Issue VC bound to DID</text>

  <line x1="490" y1="325" x2="680" y2="325" class="msg"/>
  <text x="510" y="317" class="step">4. Delegated session key</text>

  <line x1="680" y1="370" x2="860" y2="370" class="msg"/>
  <text x="698" y="362" class="step">5. Open agentic payment flow</text>

  <line x1="860" y1="415" x2="680" y2="415" class="msg"/>
  <text x="694" y="407" class="step">6. Return challenge + requirements</text>

  <line x1="680" y1="460" x2="1040" y2="460" class="msg"/>
  <text x="705" y="452" class="step">7. Submit DID proof + VC presentation</text>

  <line x1="1040" y1="505" x2="1240" y2="505" class="msg"/>
  <text x="1058" y="497" class="step">8. Verification result + assurance</text>

  <rect x="580" y="545" width="940" height="300" class="alt"/>
  <text x="600" y="570" class="note">Decision Branch</text>

  <line x1="1240" y1="600" x2="680" y2="600" class="msg"/>
  <text x="700" y="592" class="step">9A. PASS: authorization granted</text>

  <line x1="680" y1="645" x2="1420" y2="645" class="msg"/>
  <text x="704" y="637" class="step">10A. Submit signed transaction</text>

  <line x1="1420" y1="690" x2="860" y2="690" class="msg"/>
  <text x="880" y="682" class="step">11A. Settlement finality event</text>

  <line x1="860" y1="735" x2="1580" y2="735" class="msg"/>
  <text x="882" y="727" class="step">12A. Store hashes, decisions, verification refs</text>

  <line x1="1240" y1="790" x2="680" y2="790" class="msg"/>
  <text x="700" y="782" class="step">9B. FAIL: reject with reason code</text>

  <line x1="860" y1="835" x2="1580" y2="835" class="msg"/>
  <text x="882" y="827" class="step">10B. Store denial record + risk flags</text>
</svg>