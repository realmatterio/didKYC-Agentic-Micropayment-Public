  <rect x="36" y="640" width="1628" height="220" class="legend"/>
  <text x="52" y="666" class="index-title">Interaction Index (numbers replace arrows)</text>
  <text x="52" y="692" class="small">[1] Human Owner -> eKYC Issuer: initial eKYC</text>
  <text x="52" y="714" class="small">[2] eKYC Issuer -> didKYC Cold Wallet: issue VC bound to DID</text>
  <text x="52" y="736" class="small">[3] Human Owner -> Hosted Custody: top up</text>
  <text x="52" y="758" class="small">[4] Hosted Custody -> Daily Transfer</text>
  <text x="52" y="780" class="small">[5] Daily Transfer -> didKYC Cold Wallet: daily authorized transfer</text>
  <text x="52" y="802" class="small">[6] AI Agent Runtime -> Agentic Payment Button</text>
  <text x="52" y="824" class="small">[7] AI Agent Runtime -> payment_skill parser</text>
  <text x="850" y="692" class="small">[8] AI Agent Runtime -> DID VC Verifier: submit DID VC proof</text>
  <text x="850" y="714" class="small">[9] AI Agent Runtime -> Delegated Session Key: request session key</text>
  <text x="850" y="736" class="small">[10] AI Agent Runtime -> Policy Contract: signed payment transaction</text>
  <text x="850" y="758" class="small">[11] DID VC Verifier -> Policy Engine: verification result</text>
  <text x="850" y="780" class="small">[12] Policy Engine -> AI Agent Runtime: approve or reject</text>
  <text x="850" y="802" class="small">[13] Policy Contract -> Hyperledger Besu</text>
  <text x="850" y="824" class="small">[14] Audit Orchestrator -> Offchain Evidence Store: protected refs</text>
  <text x="850" y="846" class="small">[15] Policy Engine -> JFIU STR Workflow: suspicious alert</text>

